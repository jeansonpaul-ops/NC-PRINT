name: Rapport hebdo NC Print
on:
  schedule:
    - cron: '30 12 * * 5'   # vendredi 12:30 UTC (13:30 hiver / 14:30 été, heure de Luxembourg)
  workflow_dispatch:
    inputs:
      envoyer:
        description: 'Envoyer le mail (test)'
        type: boolean
        default: false
  push:
    paths: ['scripts/**', 'package.json', '.github/workflows/weekly-report.yml']
permissions:
  contents: write
concurrency: weekly-report
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: node scripts/weekly-report.mjs
      - name: Publier le rapport
        run: |
          git config user.name "nc-print-bot"
          git config user.email "bot@users.noreply.github.com"
          git add report
          git diff --cached --quiet || git commit -m "Rapport hebdo NC Print [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Envoyer le mail
        if: github.event_name == 'schedule' || inputs.envoyer == true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_FROM: ${{ vars.REPORT_FROM }}
          REPORT_TEST: ${{ github.event_name != 'schedule' }}
        run: |
          sleep 20
          node scripts/send-report.mjs
